name: Factory

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
      - run: ruby factory/test/venture_pack_loader_test.rb
      - run: bin/factory doctor
      - run: bin/factory gtm validate methaneproof
      - run: bin/factory validation pricing methaneproof
      - run: bin/factory validation gate methaneproof
      - run: bin/factory claims check methaneproof
