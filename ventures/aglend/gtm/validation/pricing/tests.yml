discovery_questions:
  economic_consequence:
    prompt: What does farm-evidence review cost in staff time, delayed origination, risk uncertainty, customer friction, or portfolio monitoring gaps?
  existing_spend:
    prompt: What adjacent spend already covers consultants, valuation, risk systems, data integration, implementation, or internal credit operations?
  budget_owner:
    prompt: Which role owns the budget and who can approve without escalation?
  buying_unit:
    prompt: What object does the customer think they are buying?
  price_tolerance:
    prompt: Which price points are easy, credible, approval-requiring, difficult, or impossible?
  expansion_economics:
    prompt: If the first workflow succeeds, what recurring or usage metric should scale with value?
price_points:
  - 50000
  - 75000
  - 125000
  - 200000
  - 300000
metric_tests:
  - metric: evidence_package
    hypothesis: possible
    reason: Useful for a first transaction, but may not capture ongoing portfolio value.
  - metric: financial_product
    hypothesis: promising
    reason: Maps to a lender product with owners, policy, and budget.
  - metric: facility
    hypothesis: promising
    reason: Facility size can anchor value and review complexity.
  - metric: portfolio
    hypothesis: promising
    reason: Portfolio surveillance creates recurring value beyond origination.
procurement_thresholds:
  - amount: 25000
    hypothesis: team_discretionary
  - amount: 75000
    hypothesis: executive_approval
  - amount: 125000
    hypothesis: procurement_review
  - amount: 200000
    hypothesis: formal_business_case
