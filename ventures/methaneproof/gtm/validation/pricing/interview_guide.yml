sequence:
  - real_behavior
  - economic_consequence
  - budget_architecture
  - explicit_price_test
  - expansion_economics
sections:
  - id: real_behavior
    stage: problem
    questions:
      - Tell me about the last time a downstream customer asked you to substantiate one of these claims.
      - What did your team actually have to do?
      - Who got pulled in?
  - id: economic_consequence
    stage: value
    questions:
      - What happens commercially when this process takes an extra two or four weeks?
      - Is this staff-effort pain, or can it hold up a customer, contract, financing event, assurance decision, or launch?
      - Have you ever hired outside people to solve pieces of this?
  - id: budget_architecture
    stage: budget
    questions:
      - Which team would normally pay for fixing this?
      - What budget would it come from?
      - Would this look internally like software, technical services, assurance, implementation, or a commercial project?
      - At what spend level does procurement materially change?
  - id: explicit_price_test
    stage: price
    questions:
      - If one sprint covered one intervention, one production environment, and one downstream acceptance workflow, what would happen internally at A$25,000?
      - At A$50,000, what changes internally?
      - At A$100,000, what would the engagement have to include for that to be credible?
  - id: expansion_economics
    stage: expansion
    questions:
      - If the first workflow succeeds, what object should scale with value?
      - Would expansion map better to intervention programs, production environments, artifacts, reliance endpoints, or an annual evidence program?
