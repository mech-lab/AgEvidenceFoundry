objective: Track whether the methane evidence problem is painful, recurrent, and externally consequential.
questions:
  - id: s01
    stage: problem_strength
    text: Did the participant describe a recent real workflow rather than a general opinion?
  - id: s02
    stage: recurrence
    text: Did the workflow recur across more than one customer, intervention, or evidence request?
signals:
  - id: workflow_reconstruction
    description: Participant can describe a specific recent evidence reconstruction.
  - id: repeated_problem
    description: Same evidence work recurs across commercial opportunities.
  - id: commercial_delay
    description: Evidence work delays acceptance, sale progression, assurance, launch, or financing.
  - id: external_reliance
    description: A processor, corporate buyer, or assurance party must inspect the output.
current:
  workflow_reconstructions: 0
  repeated_problem_confirmations: 0
  consequential_commercial_consequences: 0
