phase_zero:
  status: active
  tracks:
    - problem
    - reliance
    - buyer
    - product_artifact
    - pricing
    - architecture
  problem:
    hypothesis: Commercialization teams at methane intervention companies repeatedly reconstruct delivery, measurement, and model evidence for downstream acceptance.
  reliance:
    hypothesis: Processor, corporate buyer, or assurance acceptance is a consequential external decision, not a generic reporting preference.
  buyer:
    hypothesis: The commercialization owner feels the delay, while technical services and customer success help assemble the evidence.
  product_artifact:
    hypothesis: A methane evidence statement and verifier-ready reliance package would enter the real processor acceptance workflow.
  pricing:
    hypothesis: A paid evidence-to-reliance sprint can land inside commercialization or technical-services budget and expand by intervention program or reliance endpoint.
  architecture:
    hypothesis: MethaneProof should become a spinout company if Phase 0 proves a distinct buyer, vertical reliance workflow, separation benefit, and standalone financing case; otherwise it should remain an AgEvidence product.
