sections:
  - title: Current Workflow
    body: Trial results and product claims are assembled repeatedly for each buyer, distributor, investor, or procurement process.
  - title: Evidence Failure
    body: Buyers struggle to see the claim, evidence, analysis, applicability bounds, and review state in one durable object.
  - title: First Paid Scope
    body: Run one evidence-to-claim sprint for the claim blocking the next commercial decision.
