sequence:
  - real_behavior
  - economic_consequence
  - budget_architecture
  - explicit_price_test
  - expansion_economics
sections:
  - id: real_behavior
    stage: problem
    questions:
      - Tell me about the last time a buyer asked you to substantiate a field performance claim.
      - What did your team actually have to assemble or explain?
      - Which teams got pulled in?
  - id: economic_consequence
    stage: value
    questions:
      - What happens commercially when this process takes an extra two or four weeks?
      - Is this mainly staff effort, or can it hold up procurement, distribution, launch, financing, or investor work?
      - Have you paid consultants, trial partners, or assurance providers for adjacent work?
  - id: budget_architecture
    stage: budget
    questions:
      - Which team would normally pay for fixing this?
      - What budget would it come from?
      - Would this look internally like software, trial services, technical services, assurance, or a commercial project?
      - At what spend level does procurement materially change?
  - id: explicit_price_test
    stage: price
    questions:
      - If one sprint covered one vendor claim, one buyer-facing artifact, and one acceptance workflow, what would happen internally at A$25,000?
      - At A$50,000, what changes internally?
      - At A$100,000, what would the engagement have to include for that to be credible?
  - id: expansion_economics
    stage: expansion
    questions:
      - If the first workflow succeeds, what object should scale with customer value?
      - Would expansion map better to claims, products, trial programs, buyer portals, or annual claim infrastructure?
